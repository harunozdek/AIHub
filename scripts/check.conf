# scripts/check.conf — AIHub (.NET 10 / ASP.NET Core Web API)
# Bootstrap'te üretildi (2026-10-26). Biçim: <name>: <command> — sırayla çalışır, ilk kırmızıda durur.
# İsimdeki [fast] etiketi: adım `./scripts/check --fast` profilinde de çalışır.
# Bu projede TÜM adımlar [fast] — kod yokken hepsi saniyeler sürüyor. Bölme kararı ölçümle
# alınacak: bir adım ~1 dakikayı geçtiğinde, SEÇİCİYLE bölünür (ör. `--filter Category!=Slow` /
# `Category=Slow`), asla dosya/proje listesiyle (docs/testing.md, Two speeds, kural 4).
#
# ─── GREENFIELD GUARD ────────────────────────────────────────────────────────────────────────
# Henüz solution yok: AGENTS.md değişmez kural 1 ("spec yoksa kod yok") gereği bootstrap uygulama
# kodu yazmaz. Aşağıdaki her adım `AIHub.sln` oluşana kadar GÜRÜLTÜLÜ bir no-op'tur ve o dosya
# oluştuğu anda kendiliğinden canlanır — düzenleme gerekmez.
# UYARI: guard tam olarak `AIHub.sln` adına bakar. Solution başka bir adla oluşturulursa adımlar
# sessizce yeşil kalır ve bu bir yanlış-yeşildir. İlk planın görevi: (a) solution'ı tam bu adla
# oluşturmak VEYA guard'ı güncellemek, (b) her adımın gerçekten koştuğunu ve `test` adımının
# SIFIR OLMAYAN bir test sayısı raporladığını doğrulamak, (c) guard satırlarını kaldırmak.
#
# ─── RESOURCE HYGIENE (docs/testing.md) ──────────────────────────────────────────────────────
# .NET araç zincirinin arkada bıraktıkları ve nötrleştirmeleri:
#   MSBuild worker node'ları (MSBuild.exe)   -> MSBUILDDISABLENODEREUSE=1
#   Roslyn derleyici sunucusu (VBCSCompiler) -> UseSharedCompilation=false
#   testhost süreçleri                       -> `dotnet build-server shutdown`, AYNI adımın içinde,
#                                               çıkış kodu korunarak (ayrı son adım kırmızıda atlanır)
# Switch yerine ortam değişkeni kullanıldı: bazı test koşucuları bilinmeyen bayrağı test sürecine
# forward eder ve sessizce SIFIR test koşar (prompts/bootstrap.md, 3c).
# Veri hijyeni (kural 5): şu an kalıcı depo yok — veritabanı eklendiğinde her koşu taze bir
# şema/veritabanı ile başlamalı veya aynı adımın içinde temizlenmeli.

format [fast]: [ -f AIHub.sln ] || { echo "GREENFIELD NO-OP (AIHub.sln yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; dotnet format --verify-no-changes
build [fast]: [ -f AIHub.sln ] || { echo "GREENFIELD NO-OP (AIHub.sln yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false dotnet build --nologo; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc
test [fast]: [ -f AIHub.sln ] || { echo "GREENFIELD NO-OP (AIHub.sln yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false dotnet test --no-build --nologo; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc
