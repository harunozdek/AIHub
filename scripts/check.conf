# scripts/check.conf — AIHub (.NET 10 backend + Next.js paneli)
# Bootstrap'te üretildi, 2026-10-26'da ADR 0001 ile revize edildi.
# Biçim: <name>: <command> — sırayla çalışır, ilk kırmızıda durur.
# İsimdeki [fast] etiketi: adım `./scripts/check --fast` profilinde de çalışır.
#
# ─── İKİ HIZ, TEK SÖZLEŞME (docs/testing.md) ─────────────────────────────────────────────────
# fast  : derleme + hızlı testler + lint/typecheck — iç döngü
# full  : yukarıdakiler + konteyner gerektiren entegrasyon testleri + panel build + Playwright e2e
# Test adımı SEÇİCİYLE bölündü (kural 4): fast `Category!=Integration`, full-only tam tersi —
# "fast ∪ geri kalan = her test" yapısı gereği korunur, sonradan eklenen test mutlaka birine düşer.
# ZORUNLU: entegrasyon testleri `[Trait("Category", "Integration")]` taşımalı. Trait'i olmayan bir
# entegrasyon testi fast profilde koşar ve konteyner başlatır — bu bölmenin tek kırılma noktası.
#
# ─── GREENFIELD GUARD ────────────────────────────────────────────────────────────────────────
# .NET adımlarının guard'ı Spec 0001 (plan adım 1) ile kaldırıldı: çözüm `AIHub.slnx`, adımlar
# koşulsuz çalışır. Panel adımları `web/package.json` oluşana kadar GÜRÜLTÜLÜ bir no-op'tur;
# paneli kuran spec, test adımlarının SIFIR OLMAYAN sayı raporladığını gösterip guard'ı kaldırır.
# Test projeleri VSTest ile koşar (`IsTestingPlatformApplication=false`), `--filter` bu yüzden geçerli.
#
# ─── RESOURCE HYGIENE (docs/testing.md) ──────────────────────────────────────────────────────
# Araç zincirlerinin arkada bıraktıkları ve nötrleştirmeleri:
#   MSBuild worker node'ları (MSBuild.exe)   -> MSBUILDDISABLENODEREUSE=1
#   Roslyn derleyici sunucusu (VBCSCompiler) -> UseSharedCompilation=false
#   testhost süreçleri                       -> `dotnet build-server shutdown`, AYNI adımda,
#                                               çıkış kodu korunarak (ayrı son adım kırmızıda atlanır)
#   PostgreSQL/Redis konteynerleri           -> test fixture'ı başlatır VE durdurur (hata/timeout dahil)
#   Playwright tarayıcıları + app-under-test -> --workers=1, headless; webServer'ı Playwright
#                                               başlatır ve durdurur (reuseExistingServer: false)
#   npm                                      -> daemon yok; etkileşimli mod (next dev) check'e girmez
# Switch yerine ortam değişkeni kullanıldı: bazı test koşucuları bilinmeyen bayrağı test sürecine
# forward eder ve sessizce SIFIR test koşar.
# Veri hijyeni (kural 5): her koşu taze şema/veritabanı ile başlar; bir koşunun yazdığı satır veya
# stream girdisi bir sonraki koşuya geçmez.

format [fast]: dotnet format --verify-no-changes
build [fast]: MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false dotnet build --nologo; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc
test [fast]: MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false dotnet test --no-build --nologo --filter 'Category!=Integration'; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc
web-deps [fast]: [ -f web/package.json ] || { echo "GREENFIELD NO-OP (web/package.json yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; cd web && npm ci --no-audit --no-fund
web-lint [fast]: [ -f web/package.json ] || { echo "GREENFIELD NO-OP (web/package.json yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; cd web && npm run lint
web-typecheck [fast]: [ -f web/package.json ] || { echo "GREENFIELD NO-OP (web/package.json yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; cd web && npx --no-install tsc --noEmit
test-integration: MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false dotnet test --no-build --nologo --filter 'Category=Integration'; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc
web-build: [ -f web/package.json ] || { echo "GREENFIELD NO-OP (web/package.json yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; cd web && npm run build
e2e: [ -f web/playwright.config.ts ] || { echo "GREENFIELD NO-OP (web/playwright.config.ts yok) — bu adım DOĞRULAMA YAPMADI"; exit 0; }; cd web && npx --no-install playwright test --workers=1
